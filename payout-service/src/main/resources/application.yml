spring:
  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  datasource:
    url: jdbc:postgresql://postgres-payout:5432/payoutdb
    username: user
    password: pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  kafka:
    bootstrap-servers: kafka:29092
    consumer:
      group-id: payout-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "org.example.dto"  # Изменено: конкретный пакет вместо "*"
        spring.json.value.default.type: org.example.dto.OrderDeliveredEvent  # Добавлено: тип по умолчанию
        spring.json.use.type.headers: false  # Добавлено: не использовать заголовки типа
      auto-offset-reset: earliest  # Добавлено: начать с начала, если нет offset
      enable-auto-commit: false  # Добавлено: ручное подтверждение

management:
  health:
    redis:
      enabled: false

  endpoints:
    web:
      exposure:
        include: health,prometheus
    metrics:
      export:
        prometheus:
          enabled: true