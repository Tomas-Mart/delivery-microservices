stages:
  - build
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dmaven.artifact.threads=8"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -T 4"
  # Для Testcontainers
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  # Кэширование Docker образов
  TESTCONTAINERS_PULL_TIMEOUT: 60
  TESTCONTAINERS_RYUK_DISABLED: "false"

cache:
  key: "maven-$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/
    - .testcontainers-cache/
  policy: pull-push

build:
  stage: build
  image: maven:3.8-openjdk-17
  script:
    - mvn clean compile -Dmaven.test.skip=true
  artifacts:
    paths:
      - session-service/target/
      - order-service/target/
      - payout-service/target/
      - shared/target/
    expire_in: 1 hour

test:
  stage: test
  image: docker:24.0.7-cli  # Меняем образ на docker CLI
  services:
    - name: docker:24.0.7-dind
      alias: docker
      command: [ "--tls=false", "--mtu=1400" ]
    - name: postgres:15
      alias: postgres
    - name: redis:7
      alias: redis
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    # Для Maven нужно указать URL
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/test_db
    SPRING_REDIS_HOST: redis
    SPRING_PROFILES_ACTIVE: test
    # Важно для Testcontainers
    DOCKER_HOST: tcp://docker:2375
    TESTCONTAINERS_HOST_OVERRIDE: docker
    # Ускоряем Testcontainers
    TESTCONTAINERS_CHECKS_DISABLE: "true"
    TESTCONTAINERS_REUSE_ENABLE: "true"
    TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: dockerhub.timeweb.cloud/
  before_script:
    # Устанавливаем Maven
    - apk add --no-cache maven openjdk17
    # Настройка для ускорения Docker
    - docker system prune -f || true
    - mkdir -p .testcontainers-cache
    # Восстанавливаем кэшированные образы
    - |
      if [ -f .testcontainers-cache/kafka.tar ]; then
        docker load -i .testcontainers-cache/kafka.tar || true
      fi
  script:
    - mvn test -Dmaven.test.failure.ignore=true
  after_script:
    # Сохраняем образы в кэш
    - |
      for image in $(docker images --format "{{.Repository}}:{{.Tag}}" | grep kafka); do
        echo "Сохраняем $image в кэш..."
        docker save $image -o .testcontainers-cache/kafka.tar || true
      done
    - echo "========== РЕЗУЛЬТАТЫ ТЕСТОВ =========="
    - |
      for service in session-service order-service payout-service shared; do
        if [ -f $service/target/surefire-reports/TEST-*.xml ]; then
          echo "✅ Тесты $service:"
          grep -h "testsuite" $service/target/surefire-reports/TEST-*.xml 2>/dev/null | head -1 | sed 's/.*tests="\([^"]*\)".*errors="\([^"]*\)".*failures="\([^"]*\)".*skipped="\([^"]*\)".*/Всего: \1, Ошибки: \2, Падения: \3, Пропущено: \4/' || echo "   Нет данных"
        fi
      done
    - |
      TOTAL_TESTS=$(find . -name "TEST-*.xml" -exec grep -h "testsuite" {} \; 2>/dev/null | awk -F 'tests="' '{sum += $2}' | awk '{print int(sum)}' || echo "0")
      TOTAL_ERRORS=$(find . -name "TEST-*.xml" -exec grep -h "testsuite" {} \; 2>/dev/null | awk -F 'errors="' '{sum += $2}' | awk '{print int(sum)}' || echo "0")
      TOTAL_FAILURES=$(find . -name "TEST-*.xml" -exec grep -h "testsuite" {} \; 2>/dev/null | awk -F 'failures="' '{sum += $2}' | awk '{print int(sum)}' || echo "0")
      TOTAL_SKIPPED=$(find . -name "TEST-*.xml" -exec grep -h "testsuite" {} \; 2>/dev/null | awk -F 'skipped="' '{sum += $2}' | awk '{print int(sum)}' || echo "0")
      echo "========== ИТОГО =========="
      echo "📊 Всего тестов: ${TOTAL_TESTS:-0}"
      echo "❌ Ошибки: ${TOTAL_ERRORS:-0}"
      echo "⚠️ Падения: ${TOTAL_FAILURES:-0}"
      echo "⏭️ Пропущено: ${TOTAL_SKIPPED:-0}"
      echo "✅ Успешно: $(( ${TOTAL_TESTS:-0} - ${TOTAL_ERRORS:-0} - ${TOTAL_FAILURES:-0} - ${TOTAL_SKIPPED:-0} ))"
      echo "==========================="
  artifacts:
    paths:
      - session-service/target/surefire-reports/
      - order-service/target/surefire-reports/
      - payout-service/target/surefire-reports/
      - shared/target/surefire-reports/
    reports:
      junit:
        - session-service/target/surefire-reports/TEST-*.xml
        - order-service/target/surefire-reports/TEST-*.xml
        - payout-service/target/surefire-reports/TEST-*.xml
        - shared/target/surefire-reports/TEST-*.xml
    expire_in: 1 week
    when: always  # Загружать артефакты даже при ошибках
  needs:
    - build