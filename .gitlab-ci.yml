stages:
  - build
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  # Для Testcontainers
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/

build:
  stage: build
  image: maven:3.8-openjdk-17
  script:
    - mvn clean compile
  artifacts:
    paths:
      - session-service/target/
      - order-service/target/
      - payout-service/target/
      - shared/target/
    expire_in: 1 hour

test:
  stage: test
  image: maven:3.8-openjdk-17
  services:
    - name: docker:24.0.7-dind
      alias: docker
      command: [ "--tls=false" ]
    - name: postgres:15
      alias: postgres
    - name: redis:7
      alias: redis
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/test_db
    SPRING_REDIS_HOST: redis
    SPRING_PROFILES_ACTIVE: test
    # Важно для Testcontainers
    DOCKER_HOST: tcp://docker:2375
    TESTCONTAINERS_HOST_OVERRIDE: docker
  script:
    - mvn test
  after_script:
    - echo "========== РЕЗУЛЬТАТЫ ТЕСТОВ =========="
    - |
      if [ -f session-service/target/surefire-reports/TEST-*.xml ]; then
        echo "✅ Тесты session-service:"
        grep -h "testsuite" session-service/target/surefire-reports/TEST-*.xml | sed 's/.*tests="\([^"]*\)".*errors="\([^"]*\)".*failures="\([^"]*\)".*skipped="\([^"]*\)".*/Всего: \1, Ошибки: \2, Падения: \3, Пропущено: \4/'
      fi
    - |
      if [ -f order-service/target/surefire-reports/TEST-*.xml ]; then
        echo "✅ Тесты order-service:"
        grep -h "testsuite" order-service/target/surefire-reports/TEST-*.xml | sed 's/.*tests="\([^"]*\)".*errors="\([^"]*\)".*failures="\([^"]*\)".*skipped="\([^"]*\)".*/Всего: \1, Ошибки: \2, Падения: \3, Пропущено: \4/'
      fi
    - |
      if [ -f payout-service/target/surefire-reports/TEST-*.xml ]; then
        echo "✅ Тесты payout-service:"
        grep -h "testsuite" payout-service/target/surefire-reports/TEST-*.xml | sed 's/.*tests="\([^"]*\)".*errors="\([^"]*\)".*failures="\([^"]*\)".*skipped="\([^"]*\)".*/Всего: \1, Ошибки: \2, Падения: \3, Пропущено: \4/'
      fi
    - |
      if [ -f shared/target/surefire-reports/TEST-*.xml ]; then
        echo "✅ Тесты shared:"
        grep -h "testsuite" shared/target/surefire-reports/TEST-*.xml | sed 's/.*tests="\([^"]*\)".*errors="\([^"]*\)".*failures="\([^"]*\)".*skipped="\([^"]*\)".*/Всего: \1, Ошибки: \2, Падения: \3, Пропущено: \4/'
      fi
    - |
      TOTAL_TESTS=$(find . -name "TEST-*.xml" -exec grep -h "testsuite" {} \; | awk -F 'tests="' '{sum += $2}' | awk '{print $1}')
      TOTAL_ERRORS=$(find . -name "TEST-*.xml" -exec grep -h "testsuite" {} \; | awk -F 'errors="' '{sum += $2}' | awk '{print $1}')
      TOTAL_FAILURES=$(find . -name "TEST-*.xml" -exec grep -h "testsuite" {} \; | awk -F 'failures="' '{sum += $2}' | awk '{print $1}')
      TOTAL_SKIPPED=$(find . -name "TEST-*.xml" -exec grep -h "testsuite" {} \; | awk -F 'skipped="' '{sum += $2}' | awk '{print $1}')
      echo "========== ИТОГО =========="
      echo "📊 Всего тестов: $TOTAL_TESTS"
      echo "❌ Ошибки: $TOTAL_ERRORS"
      echo "⚠️ Падения: $TOTAL_FAILURES"
      echo "⏭️ Пропущено: $TOTAL_SKIPPED"
      echo "✅ Успешно: $((TOTAL_TESTS - TOTAL_ERRORS - TOTAL_FAILURES - TOTAL_SKIPPED))"
      echo "==========================="
  artifacts:
    paths:
      - session-service/target/surefire-reports/
      - order-service/target/surefire-reports/
      - payout-service/target/surefire-reports/
      - shared/target/surefire-reports/
    reports:
      junit:
        - session-service/target/surefire-reports/TEST-*.xml
        - order-service/target/surefire-reports/TEST-*.xml
        - payout-service/target/surefire-reports/TEST-*.xml
        - shared/target/surefire-reports/TEST-*.xml
    expire_in: 1 week