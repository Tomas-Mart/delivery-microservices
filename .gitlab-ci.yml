stages:
  - build
  - test
  - docker
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  DOCKER_BUILDKIT: "1"
  DOCKER_DRIVER: overlay2
  # Для Testcontainers
  TESTCONTAINERS_RYUK_DISABLED: "true"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/

build:
  stage: build
  image: maven:3.8-openjdk-17
  script:
    - mvn clean compile
  artifacts:
    paths:
      - session-service/target/
      - order-service/target/
      - payout-service/target/
      - shared/target/
    expire_in: 1 hour

test:
  stage: test
  image: maven:3.8-openjdk-17
  services:
    - name: docker:24.0.7-dind
      alias: docker
      command: [ "--tls=false" ]
    - name: postgres:15
      alias: postgres
    - name: redis:7
      alias: redis
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/test_db
    SPRING_REDIS_HOST: redis
    SPRING_PROFILES_ACTIVE: test
    # Важно для Testcontainers
    DOCKER_HOST: tcp://docker:2375
    TESTCONTAINERS_HOST_OVERRIDE: docker
  script:
    - mvn test
  after_script:
    - echo "========== РЕЗУЛЬТАТЫ ТЕСТОВ =========="
    - |
      if [ -f session-service/target/surefire-reports/TEST-*.xml ]; then
        echo "✅ Тесты session-service:"
        grep -h "testsuite" session-service/target/surefire-reports/TEST-*.xml | sed 's/.*tests="\([^"]*\)".*errors="\([^"]*\)".*failures="\([^"]*\)".*skipped="\([^"]*\)".*/Всего: \1, Ошибки: \2, Падения: \3, Пропущено: \4/'
      fi
    - |
      if [ -f order-service/target/surefire-reports/TEST-*.xml ]; then
        echo "✅ Тесты order-service:"
        grep -h "testsuite" order-service/target/surefire-reports/TEST-*.xml | sed 's/.*tests="\([^"]*\)".*errors="\([^"]*\)".*failures="\([^"]*\)".*skipped="\([^"]*\)".*/Всего: \1, Ошибки: \2, Падения: \3, Пропущено: \4/'
      fi
    - |
      if [ -f payout-service/target/surefire-reports/TEST-*.xml ]; then
        echo "✅ Тесты payout-service:"
        grep -h "testsuite" payout-service/target/surefire-reports/TEST-*.xml | sed 's/.*tests="\([^"]*\)".*errors="\([^"]*\)".*failures="\([^"]*\)".*skipped="\([^"]*\)".*/Всего: \1, Ошибки: \2, Падения: \3, Пропущено: \4/'
      fi
    - |
      if [ -f shared/target/surefire-reports/TEST-*.xml ]; then
        echo "✅ Тесты shared:"
        grep -h "testsuite" shared/target/surefire-reports/TEST-*.xml | sed 's/.*tests="\([^"]*\)".*errors="\([^"]*\)".*failures="\([^"]*\)".*skipped="\([^"]*\)".*/Всего: \1, Ошибки: \2, Падения: \3, Пропущено: \4/'
      fi
    - |
      TOTAL_TESTS=$(find . -name "TEST-*.xml" -exec grep -h "testsuite" {} \; | awk -F 'tests="' '{sum += $2}' | awk '{print $1}')
      TOTAL_ERRORS=$(find . -name "TEST-*.xml" -exec grep -h "testsuite" {} \; | awk -F 'errors="' '{sum += $2}' | awk '{print $1}')
      TOTAL_FAILURES=$(find . -name "TEST-*.xml" -exec grep -h "testsuite" {} \; | awk -F 'failures="' '{sum += $2}' | awk '{print $1}')
      TOTAL_SKIPPED=$(find . -name "TEST-*.xml" -exec grep -h "testsuite" {} \; | awk -F 'skipped="' '{sum += $2}' | awk '{print $1}')
      echo "========== ИТОГО =========="
      echo "📊 Всего тестов: $TOTAL_TESTS"
      echo "❌ Ошибки: $TOTAL_ERRORS"
      echo "⚠️ Падения: $TOTAL_FAILURES"
      echo "⏭️ Пропущено: $TOTAL_SKIPPED"
      echo "✅ Успешно: $((TOTAL_TESTS - TOTAL_ERRORS - TOTAL_FAILURES - TOTAL_SKIPPED))"
      echo "==========================="
  artifacts:
    paths:
      - session-service/target/surefire-reports/
      - order-service/target/surefire-reports/
      - payout-service/target/surefire-reports/
      - shared/target/surefire-reports/
    reports:
      junit:
        - session-service/target/surefire-reports/TEST-*.xml
        - order-service/target/surefire-reports/TEST-*.xml
        - payout-service/target/surefire-reports/TEST-*.xml
        - shared/target/surefire-reports/TEST-*.xml
    expire_in: 1 week

.docker-template: &docker-template
  image: docker:24.0.7-cli
  services:
    - docker:24.0.7-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # Устанавливаем buildx вручную
    - mkdir -p ~/.docker/cli-plugins
    - wget -qO- https://github.com/docker/buildx/releases/download/v0.12.0/buildx-v0.12.0.linux-amd64 > ~/.docker/cli-plugins/docker-buildx
    - chmod +x ~/.docker/cli-plugins/docker-buildx
    - docker buildx version
    - docker buildx create --name mybuilder --use || true
    - docker buildx inspect --bootstrap
  after_script:
    - docker buildx rm mybuilder || true

docker:
  stage: docker
  <<: *docker-template
  variables:
    BUILDKIT_PROGRESS: plain
    DOCKER_BUILDKIT: 1
    BUILDKIT_NO_CLIENT_LOG: 1
  script:
    - |
      for service in session-service order-service payout-service; do
        case "$service" in
          session-service) port=8081 ;;
          order-service)   port=8082 ;;
          payout-service)  port=8083 ;;
        esac
        echo "Сборка $service на порту $port..."
      
        # Используем уникальное имя образа с префиксом v2
        NEW_IMAGE_NAME="$CI_REGISTRY_IMAGE/v2-$service"
      
        # Полностью очищаем локальный кэш buildx
        docker buildx rm mybuilder || true
        docker buildx create --name mybuilder --use
      
        docker buildx build \
          --no-cache \
          --pull \
          --builder mybuilder \
          --build-arg SERVICE_NAME=$service \
          --build-arg SERVICE_PORT=$port \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --tag $NEW_IMAGE_NAME:latest \
          --tag $NEW_IMAGE_NAME:$CI_COMMIT_SHORT_SHA \
          --file Dockerfile \
          --push \
          .
      
        echo "Образ $service успешно собран как $NEW_IMAGE_NAME:latest"
      done
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_COMMIT_BRANCH == "develop"
      when: always
    - if: $CI_COMMIT_TAG
      when: never
    - when: manual
      allow_failure: true