stages:
  - build
  - test
  - docker
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  DOCKER_BUILDKIT: "1"
  DOCKER_DRIVER: overlay2
  # Для Testcontainers
  TESTCONTAINERS_RYUK_DISABLED: "true"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/

build:
  stage: build
  image: maven:3.8-openjdk-17
  script:
    - mvn clean compile
  artifacts:
    paths:
      - session-service/target/
      - order-service/target/
      - payout-service/target/
      - shared/target/
    expire_in: 1 hour

test:
  stage: test
  image: maven:3.8-openjdk-17
  services:
    - name: docker:24.0.7-dind
      alias: docker
      command: [ "--tls=false" ]
    - name: postgres:15
      alias: postgres
    - name: redis:7
      alias: redis
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/test_db
    SPRING_REDIS_HOST: redis
    SPRING_PROFILES_ACTIVE: test
    # Важно для Testcontainers
    DOCKER_HOST: tcp://docker:2375
    TESTCONTAINERS_HOST_OVERRIDE: docker
  script:
    - mvn test

.docker-template: &docker-template
  image: docker:24.0.7-cli
  services:
    - docker:24.0.7-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # Устанавливаем buildx вручную
    - mkdir -p ~/.docker/cli-plugins
    - wget -qO- https://github.com/docker/buildx/releases/download/v0.12.0/buildx-v0.12.0.linux-amd64 > ~/.docker/cli-plugins/docker-buildx
    - chmod +x ~/.docker/cli-plugins/docker-buildx
    - docker buildx version
    - docker buildx create --name mybuilder --use || true
    - docker buildx inspect --bootstrap
  after_script:
    - docker buildx rm mybuilder || true

docker:
  stage: docker
  <<: *docker-template
  script:
    - |
      for service in session-service order-service payout-service; do
        case "$service" in
          session-service) port=8081 ;;
          order-service)   port=8082 ;;
          payout-service)  port=8083 ;;
        esac
        echo "Building $service on port $port..."
        docker buildx build \
          --builder mybuilder \
          --build-arg SERVICE_NAME=$service \
          --build-arg SERVICE_PORT=$port \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from $CI_REGISTRY_IMAGE/$service:latest \
          --tag $CI_REGISTRY_IMAGE/$service:$CI_COMMIT_SHORT_SHA \
          --tag $CI_REGISTRY_IMAGE/$service:$CI_COMMIT_REF_SLUG \
          --tag $CI_REGISTRY_IMAGE/$service:latest \
          --file Dockerfile \
          --push \
          .
      done
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_COMMIT_BRANCH == "develop"
      when: always
    - if: $CI_COMMIT_TAG
      when: never
    - when: manual
      allow_failure: true